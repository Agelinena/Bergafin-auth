<style>
  :root { color-scheme: dark; }

  p { margin: .5rem 0; color: #c8c8c8; }
  input { width: 100%; box-sizing: border-box; font-size: 1.6rem; letter-spacing: .3rem; text-align: center;
          padding: .6rem; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; margin: 1rem 0; }
  button { width: 100%; padding: .75rem; font-size: 1rem; border: 0; border-radius: 8px; background: #00a4dc; color: #fff; cursor: pointer; }
  a { color: #00a4dc; }
</style>
