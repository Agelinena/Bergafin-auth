<h1>Conectar aparelho</h1>
<p>Digite o código que aparece na TV ou no app. Depois você confirma quem é no Authentik.</p>
<form method="get" action="QuickConnect">
  <input name="code" inputmode="numeric" pattern="[0-9]{6,10}" autocomplete="one-time-code" required autofocus aria-label="Código do Quick Connect">
  <button type="submit">Continuar</button>
</form>
